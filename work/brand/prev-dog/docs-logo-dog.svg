<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<defs><linearGradient id="pg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#2ee6a8"/></linearGradient></defs>
<rect x="0" y="0" width="64" height="64" rx="15" fill="#101421"/>
<rect x="1.15" y="1.15" width="61.7" height="61.7" rx="14" fill="none" stroke="url(#pg)" stroke-width="1.7" opacity=".55"/>
<g transform="translate(32,32) scale(0.88) translate(-32,-32)">

 <defs>
  <linearGradient id="dogG" x1="0" y1="1" x2="1" y2="0">
   <stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#2ee6a8"/>
  </linearGradient>
 </defs>
 <!-- 耳朵（头后面，宽一点、圆一点） -->
 <path d="M16 27 Q10.5 8 13.6 6.6 Q15.6 5.7 18.4 8.2 L31 15.5 Z" fill="url(#dogG)"/>
 <path d="M48 27 Q53.5 8 50.4 6.6 Q48.4 5.7 45.6 8.2 L33 15.5 Z" fill="url(#dogG)"/>
 <!-- 头 -->
 <circle cx="32" cy="35" r="21.5" fill="#f6f8fd" stroke="url(#dogG)" stroke-width="2.6"/>
 <!-- 额头小钻石 -->
 <path d="M32 19 l4.4 4.4 -4.4 5.2 -4.4 -5.2 z" fill="url(#dogG)"/>
 <!-- 口鼻（浅灰，带一圈更浅的描边，小尺寸下也能看出是嘴） -->
 <ellipse cx="32" cy="43.4" rx="12" ry="9" fill="#e8edf7" stroke="#ccd6e8" stroke-width="1"/>
 <!-- 眼睛 -->
 <circle cx="24.2" cy="32.4" r="3.3" fill="#141824"/>
 <circle cx="39.8" cy="32.4" r="3.3" fill="#141824"/>
 <circle cx="25.3" cy="31.1" r="1.15" fill="#ffffff"/>
 <circle cx="40.9" cy="31.1" r="1.15" fill="#ffffff"/>
 <!-- 鼻子 -->
 <path d="M32 38.4 q4.8 0 4.8 2.7 q0 3.6 -4.8 5.5 q-4.8 -1.9 -4.8 -5.5 q0 -2.7 4.8 -2.7 z" fill="#141824"/>
 <!-- 嘴 -->
 <path d="M32 46.6 v2.2 M32 48.8 q-3.3 3 -6.3 0.6 M32 48.8 q3.3 3 6.3 0.6"
       fill="none" stroke="#141824" stroke-width="1.5" stroke-linecap="round"/>

</g></svg>
