# 用法：docker compose up -d
# 访问：http://你的服务器IP:8080
# 停止：docker compose down

services:
  dashboard:
    build: .
    image: pons-dashboard:latest
    container_name: pons-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
