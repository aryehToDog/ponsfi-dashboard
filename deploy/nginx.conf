# Pons / StonkFun 监控看板 —— nginx 配置
# 手动安装时：复制到 /etc/nginx/conf.d/pons-dashboard.conf
# 然后执行：nginx -t && systemctl reload nginx

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/pons-dashboard;
    index index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    server_tokens off;

    gzip on;
    gzip_types text/html text/css application/javascript;

    access_log /var/log/nginx/pons-dashboard.access.log;
    error_log  /var/log/nginx/pons-dashboard.error.log;
}
