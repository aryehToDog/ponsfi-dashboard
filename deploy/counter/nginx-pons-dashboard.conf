server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name ponsfi.xyz www.ponsfi.xyz ponspulse.com www.ponspulse.com _;

    root /var/www/pons-dashboard;
    index index.html;

    charset utf-8;
    server_tokens off;

    location /audio/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header Accept-Ranges bytes;
    }

    # 浏览量计数：转发给本机 8788 上的 pons-counter（systemd 托管）
    location = /api/hits {
        proxy_pass http://127.0.0.1:8788/hit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location = /api/stats {
        proxy_pass http://127.0.0.1:8788/stats;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/html text/css application/javascript;

    access_log /var/log/nginx/pons-dashboard.access.log;
    error_log  /var/log/nginx/pons-dashboard.error.log;
}
